custom_proxy_group=🇺🇸 US 自动`url-test`^(?!\[)(?=.*(美|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|United States|(?<![a-zA-Z])US(?![a-zA-Z])|(?<![a-zA-Z])USA(?![a-zA-Z])|🇺🇸))(?!.*(下载|移动|电信|联通|中转|入口|跳板)).*$`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇸🇬 SG 自动`url-test`^(?!\[)(?=.*(新加坡|坡|狮城|SG|Singapore|🇸🇬))(?!.*(下载|移动|电信|联通|中转|入口|跳板)).*$`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇹🇼 TW 自动`url-test`^(?!\[)(?=.*(台|新北|彰化|台中|台北|TW|Taiwan|Taipei|🇹🇼))(?!.*(下载|移动|电信|联通|中转|入口|跳板)).*$`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇰🇷 KR 自动`url-test`^(?!\[)(?=.*(KR|Korea|KOR|首尔|韩|韓|🇰🇷))(?!.*(下载|移动|电信|联通|中转|入口|跳板)).*$`https://www.gstatic.com/generate_204`300,5,50


; -----------------------------------------------------------------
; [6. 基础直连与广告拦截]
; -----------------------------------------------------------------
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]🐸 手动切换
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT


; -----------------------------------------------------------------
; [7. 环境运行与全域容错参数]
; -----------------------------------------------------------------
enable_rule_generator=true
overwrite_original_rules=true
udp_support=true
tfo_support=true

; 强制全局跳过证书检验（拯救 IP 形式域名、自签证书、CDN 域名不一致节点）
scv=true

; 终极多语言垃圾节点清洗过滤器（防止任何垃圾提示占用策略组）
exclude_remarks=(?i)(剩余|重置|到期|过期|官网|通知|提示|维护|客服|群|推荐|如果看不到|更换客户端|Traffic|Expire|Reset|Channel|Telegram|Notice|Valid|Website)

; -----------------------------------------------------------------
; [5. 区域自动优选池 - 强力排除廉价备用与跳板，保持纯净测速]
; -----------------------------------------------------------------
custom_proxy_group=♻️ 全球自动`url-test`^(?!\[)(?!.*(测试|俄罗斯|缅甸|越南|南极|下载|移动|电信|联通|中转|入口|跳板|BGP)).*$`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇭🇰 HK 自动`url-test`^(?!\[)(?=.*(香港|HK|Hong Kong|HongKong|🇭🇰))(?!.*(下载|移动|电信|联通|中转|入口|跳板)).*$`https://www.gstatic.com/generate_204`300,5,50

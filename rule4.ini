; [自动测速池 - 屏蔽 "[" 开头的廉价节点，保证主力测速纯净]
custom_proxy_group=♻️ 全球自动`url-test`^(?!\[)(?!.*(测试|俄罗斯|缅甸|越南|南极|下载专用|移动|电信|联通)).*$`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇭🇰 HK 自动`url-test`^(?!\[)(?=.*(香港|HK|Hong Kong))(?!.*(下载专用|移动|电信|联通)).*$`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇯🇵 JP 自动`url-test`^(?!\[)(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))(?!.*(下载专用|移动|电信|联通)).*$`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇺🇸 US 自动`url-test`^(?!\[)(?=.*(美|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|United States|(?<![a-zA-Z])US(?![a-zA-Z])|(?<![a-zA-Z])USA(?![a-zA-Z])|(?<![a-zA-Z])USD(?![a-zA-Z])))(?!.*(下载专用|移动|电信|联通)).*$`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇸🇬 SG 自动`url-test`^(?!\[)(?=.*(新加坡|坡|狮城|SG|Singapore))(?!.*(下载专用|移动|电信|联通)).*$`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇹🇼 TW 自动`url-test`^(?!\[)(?=.*(台|新北|彰化|TW|Taiwan))(?!.*(下载专用|移动|电信|联通)).*$`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇰🇷 KR 自动`url-test`^(?!\[)(?=.*(KR|Korea|KOR|首尔|韩|韓))(?!.*(下载专用|移动|电信|联通)).*$`https://www.gstatic.com/generate_204`300,5,50

; [直连与拦截]
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]🐸 手动切换
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT

; [底端放置：前置中转与跳板 - 绝不置顶侵占面板视线]
custom_proxy_group=前置中转`select`[]DIRECT`[]跳板线路`.*(移动|电信|联通)
custom_proxy_group=跳板线路`url-test`.*(移动|电信|联通).*$`http://connectivitycheck.platform.hicloud.com/generate_204`300,5,100

; [环境参数]
enable_rule_generator=true
overwrite_original_rules=true
exclude_remarks=(?i)(免费|距离下次重置|如果看不到节点|套餐到期|官网|更新订阅|剩余流量)
udp_support=true

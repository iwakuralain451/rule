# =================================================================
# 终极工业级纯净配置模板 clash_template.yaml (Sub-Store + Mihomo 专属版)
# 转换来源: rule4.ini (1:1 完整复刻分流规则与策略组拓扑)
# =================================================================

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true


# -----------------------------------------------------------------
# [1. 节点提供者 - 对接本地 Sub-Store 自动合并与无损解析]
# -----------------------------------------------------------------
proxy-providers:
  Merged:
    type: http
    url: "http://10.19.19.199:3001/download/collection/Merged?target=ClashMeta"
    path: ./providers/merged.yaml
    interval: 86400
    health-check:
      enable: true
      url: "http://www.gstatic.com/generate_204"
      interval: 300

# -----------------------------------------------------------------
# [2. 策略组依赖层 - 时序对齐: 前置跳板拓扑 -> 落地收容 -> 业务分流]
# -----------------------------------------------------------------
proxy-groups:
  # 主路由入口
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 全球自动
      - 🐸 手动切换
      - 🐷 廉价备用
      - 🇭🇰 HK 自动
      - 🇯🇵 JP 自动
      - 🇸🇬 SG 自动
      - 🇺🇸 US 自动
      - 🇹🇼 TW 自动
      - 🇰🇷 KR 自动
      - DIRECT

  # 【前置中转拓扑】：全自动吸纳所有国内 HTTP/免流/BGP 跳板，并提供直连备选
  - name: 前置中转
    type: select
    proxies:
      - DIRECT
      - 跳板线路
    use:
      - Merged
    filter: "(?i).*(移动|电信|联通|中转|入口|跳板|南京|广州|北京|上海|深圳|保定|苏州|BGP).*"

  # 【跳板线路】：国内中转自动优选（绑定国内专属测速地址，避免外网测试误报断连）
  - name: 跳板线路
    type: url-test
    use:
      - Merged
    filter: "(?i).*(移动|电信|联通|中转|入口|跳板|南京|广州|北京|上海|深圳|保定|苏州|BGP).*"
    url: "http://connectivitycheck.platform.hicloud.com/generate_204"
    interval: 300
    tolerance: 100

  # -----------------------------------------------------------------
  # [3. 专属控制与备用收容层]
  # -----------------------------------------------------------------

  # 【全局手动中心】：全量展示主力 + 备用机场落地，智能剔除不能直接翻墙的国内跳板
  - name: 🐸 手动切换
    type: select
    proxies:
      - ♻️ 全球自动
      - 🇭🇰 HK 自动
      - 🇯🇵 JP 自动
      - 🇸🇬 SG 自动
      - 🇺🇸 US 自动
      - 🇹🇼 TW 自动
      - 🇰🇷 KR 自动
      - DIRECT
    use:
      - Merged
    filter: "^(?!.*(移动|电信|联通|中转|入口|跳板|南京|广州|北京|上海|深圳|保定|苏州|BGP|Transit)).*$"

  # 【谷歌统管中心】
  - name: 🇬 谷歌专属
    type: select
    proxies:
      - 🇺🇸 US 自动
      - 🚀 节点选择
      - ♻️ 全球自动
      - 🇭🇰 HK 自动
      - 🇯🇵 JP 自动
      - 🇸🇬 SG 自动
      - 🇹🇼 TW 自动
      - 🇰🇷 KR 自动
      - DIRECT
    use:
      - Merged
    filter: "^(?!.*(移动|电信|联通|中转|入口|跳板|南京|广州|北京|上海|深圳|保定|苏州|BGP|Transit)).*$"

  # 【廉价/备用收容所】：捕获低倍率标识的节点
  - name: 🐷 廉价备用
    type: select
    use:
      - Merged
    filter: '(?i)(^\[.*$|.*(x0\.|廉价|备用|Download).*)'

  # -----------------------------------------------------------------
  # [4. 业务精准分流层]
  # -----------------------------------------------------------------
  - name: 🎯 GoogleFCM
    type: select
    proxies:

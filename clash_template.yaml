# -----------------------------------------------------------------
# [8. 分流规则列表 - 严格按照原 rule4.ini 优先级编排]
# -----------------------------------------------------------------
rules:
  # 【底层链路保护】免流中转与落地服务器直连，防止代理环路
  - DOMAIN,down.dingtalk.com,DIRECT
  - DOMAIN,saas.sin.fan,DIRECT
  - DOMAIN-SUFFIX,6rguyesfdhvbz.uk,DIRECT

  # 【体验优化】阻断 QUIC/HTTP3，避免 UDP 443 运营商 QoS 限速卡顿
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # 广告拦截
  - GEOSITE,category-ads-all,🛑 广告拦截

  # 局域网直连
  - GEOIP,LAN,🎯 全球直连,no-resolve

  # 用户自定义直连规则 (direct.ini, ms_direct.ini)
  - RULE-SET,direct_custom,🎯 全球直连
  - RULE-SET,ms_direct_custom,🎯 全球直连

  # Gemini 专用
  - RULE-SET,gemini_custom,Gemini

  # Spotify
  - GEOSITE,spotify,Spotify

  # ExHentai
  - RULE-SET,exhentai_custom,🔞 ExHentai

  # Google FCM 消息推送
  - DOMAIN-SUFFIX,mtalk.google.com,🎯 GoogleFCM
  - DOMAIN-KEYWORD,mtalk.google,🎯 GoogleFCM

  # 特殊节点选择
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,🚀 节点选择
  - DOMAIN-SUFFIX,services.googleapis.cn,🚀 节点选择

  # X (Twitter) & Grok
  - GEOSITE,twitter,🐦 X
  - GEOSITE,xai,🐦 X
  - DOMAIN-SUFFIX,grok.com,🐦 X
  - DOMAIN-KEYWORD,grok,🐦 X

  # Copilot & Bing
  - GEOSITE,bing,💧 Copilot
  - RULE-SET,copilot_custom,💧 Copilot

  # 开发与微软服务
  - GEOSITE,github,🚀 节点选择
  - GEOSITE,microsoft,🎞️ Microsoft
  - GEOSITE,google,🍀 Google
  - GEOSITE,onedrive,🐬 OneDrive

  # Telegram
  - GEOSITE,telegram,📲 Telegram
  - GEOIP,telegram,📲 Telegram,no-resolve

  # 影音与社交流媒体
  - GEOSITE,youtube,📹 YouTube
  - GEOSITE,tiktok,🎵 TikTok

  # GFW 列表
  - GEOSITE,gfw,🚀 节点选择

  # 国内直连 (GeoSite CN, GeoIP CN)
  - GEOSITE,cn,🎯 全球直连
  - GEOIP,cn,🎯 全球直连,no-resolve

  # 兜底规则
  - MATCH,🐟 漏网之鱼
